<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Engine Prototype</title>
<!-- Stand-alone test bed for the garden scene's weather (src/Mazesta.Diagnostics.Gpu/Scene/GardenWeather.cs). Nothing here is wired into the app:
     once a behaviour looks right, port it to GardenWeather / GardenWind and the scene shaders. Open this file in any browser (WebGL2). -->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px/1.4 system-ui,sans-serif;color:#eee}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:10px;left:10px;background:#000a;padding:10px 12px;border-radius:8px;width:250px}
#ui label{display:flex;justify-content:space-between;gap:8px;margin:4px 0}#ui input[type=range]{width:130px}
#hud{position:fixed;bottom:10px;left:10px;background:#000a;padding:8px 12px;border-radius:8px;font-family:Consolas,monospace;white-space:pre}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><b>Weather engine</b>
<label>Auto weather <input id="auto" type="checkbox" checked></label>
<label>Storm <input id="storm" type="range" min="0" max="1" step="0.01" value="0.2"></label>
<label>Wind m/s <input id="wind" type="range" min="0" max="25" step="0.5" value="6"></label>
<label>Wind dir <input id="dir" type="range" min="0" max="6.283" step="0.01" value="0.6"></label>
<label>Wood E (GPa) <input id="wood" type="range" min="1" max="10" step="0.5" value="3"></label>
<div style="opacity:.7;margin-top:6px">Drag: orbit · wheel: zoom</div></div>
<div id="hud"></div>
<script>
'use strict';
const cv=document.getElementById('c'), gl=cv.getContext('webgl2',{antialias:true});
if(!gl) document.body.innerHTML='<p style="padding:20px">WebGL2 is not available.</p>';
const $=id=>document.getElementById(id);

// ---------- math ----------
const Q={
 mul:(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]],
 axis:(x,y,z,a)=>{const s=Math.sin(a/2);return[x*s,y*s,z*s,Math.cos(a/2)]},
 vec:v=>{const a=Math.hypot(v[0],v[1],v[2]);if(a<1e-9)return[0,0,0,1];const s=Math.sin(a/2)/a;return[v[0]*s,v[1]*s,v[2]*s,Math.cos(a/2)]},
 rot:(q,v)=>{const[x,y,z,w]=q,tx=2*(y*v[2]-z*v[1]),ty=2*(z*v[0]-x*v[2]),tz=2*(x*v[1]-y*v[0]);return[v[0]+w*tx+y*tz-z*ty,v[1]+w*ty+z*tx-x*tz,v[2]+w*tz+x*ty-y*tx]},
 conj:q=>[-q[0],-q[1],-q[2],q[3]]};
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>scl(a,1/Math.hypot(a[0],a[1],a[2])), clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function trs(o,i,q,p,sx,sy,sz){const[x,y,z,w]=q,xx=x*x,yy=y*y,zz=z*z,xy=x*y,xz=x*z,yz=y*z,wx=w*x,wy=w*y,wz=w*z;
 o[i]=(1-2*(yy+zz))*sx;o[i+1]=2*(xy+wz)*sx;o[i+2]=2*(xz-wy)*sx;o[i+3]=0;o[i+4]=2*(xy-wz)*sy;o[i+5]=(1-2*(xx+zz))*sy;o[i+6]=2*(yz+wx)*sy;o[i+7]=0;
 o[i+8]=2*(xz+wy)*sz;o[i+9]=2*(yz-wx)*sz;o[i+10]=(1-2*(xx+yy))*sz;o[i+11]=0;o[i+12]=p[0];o[i+13]=p[1];o[i+14]=p[2];o[i+15]=1;}
function mmul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
function persp(fy,as,n,f){const t=1/Math.tan(fy/2);return new Float32Array([t/as,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]);}
function lookAt(e,at){const f=norm(sub(at,e)),s=norm(cross(f,[0,1,0])),u=cross(s,f);return{m:new Float32Array([s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-dot(s,e),-dot(u,e),dot(f,e),1]),f,s,u};}
let seed=7; const rng=()=>(seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296;
function hash3(i,j,k){let h=Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(k,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function noise3(x,y,z){const i=Math.floor(x),j=Math.floor(y),k=Math.floor(z);let u=x-i,v=y-j,w=z-k;u=u*u*(3-2*u);v=v*v*(3-2*v);w=w*w*(3-2*w);
 const L=(a,b,t)=>a+(b-a)*t;return L(L(L(hash3(i,j,k),hash3(i+1,j,k),u),L(hash3(i,j+1,k),hash3(i+1,j+1,k),u),v),L(L(hash3(i,j,k+1),hash3(i+1,j,k+1),u),L(hash3(i,j+1,k+1),hash3(i+1,j+1,k+1),u),v),w);}

// ---------- weather state: clouds lead, rain lags behind the cover ----------
const W={storm:0.2,target:0.2,cover:0.2,rain:0,wet:0,flash:0,speed:6,dir:0.6,gusty:0.3,E:3e9,nextAuto:30};
const AUTO=[0.1,0.45,0.85,1,0.7,0.3,0.05];let autoI=0;
let T=0;
function stepWeather(dt){
 if($('auto').checked){ if((W.nextAuto-=dt)<=0){W.target=AUTO[autoI++%AUTO.length];W.nextAuto=35+rng()*20;$('storm').value=W.target;} } else W.target=+$('storm').value;
 W.storm+=(W.target-W.storm)*Math.min(1,dt/15);
 W.cover+=(clamp(0.12+W.storm*1.0,0,1)-W.cover)*Math.min(1,dt/10);
 const rt=W.cover>0.62?clamp((W.cover-0.62)/0.38,0,1)*clamp(W.storm*1.2,0,1):0; // no rain until the sky has closed
 W.rain+=(rt-W.rain)*Math.min(1,dt/6);
 W.wet=clamp(W.wet+(W.rain*0.15-(1-W.cover)*0.03-0.004)*dt,0,1);
 W.speed=+$('wind').value*(1+0.6*W.storm); W.dir=+$('dir').value; W.gusty=0.25+0.55*W.storm; W.E=+$('wood').value*1e9;
 if(W.rain>0.7&&rng()<dt*0.12*W.rain)W.flash=1; W.flash*=Math.exp(-dt*7);
}
// Mean wind with a log height profile, gust fronts carried along by it, and small-scale turbulence (turb=false for cheap callers).
function wind(x,y,z,turb){
 const S=W.speed,dx=Math.cos(W.dir),dz=Math.sin(W.dir);
 const prof=Math.log(Math.max(y,0.15)/0.05)/Math.log(10/0.05);
 const g=noise3((x-dx*S*T)*0.035,(z-dz*S*T)*0.035,T*0.04);
 const m=S*prof*Math.max(0.05,1+W.gusty*(g*2-1)*1.8);
 if(!turb)return[m*dx,0,m*dz];
 const tu=W.gusty*S*0.5;
 return[m*dx+tu*(noise3(x*0.4+T*0.9,y*0.4,z*0.4)-0.5),tu*0.5*(noise3(x*0.4,y*0.4+T*0.9,z*0.4+17)-0.5),m*dz+tu*(noise3(x*0.4+31,y*0.4,z*0.4+T*0.9)-0.5)];
}

// ---------- scene layout ----------
const POND={x:3,z:2,r:5};
const stones=[]; // {x,z,hx,hz,h}
for(let i=0;i<14;i++)stones.push({x:-15+i*0.95,z:2.5+Math.sin(i*0.7)*0.4,hx:0.4,hz:0.4,h:0.06});
for(let i=0;i<9;i++){const a=i/9*6.283+0.3;stones.push({x:POND.x+Math.cos(a)*(POND.r+0.4),z:POND.z+Math.sin(a)*(POND.r+0.4),hx:0.35+rng()*0.4,hz:0.3+rng()*0.3,h:0.25+rng()*0.35});}
function stoneAt(x,z){for(const s of stones)if(Math.abs(x-s.x)<s.hx&&Math.abs(z-s.z)<s.hz)return s;return null;}
const inPond=(x,z)=>(x-POND.x)**2+(z-POND.z)**2<POND.r*POND.r;

// ---------- trees: rigid branch segments on damped angular springs (Euler-Bernoulli stiffness), loaded by aerodynamic drag ----------
const RHO=1.2, CD=0.8, AREA_SCALE=3, LEAF_AREA=0.017, LEAF_MASS=0.004; // AREA_SCALE: foliage that is not drawn still catches wind
const trees=[];
function buildTree(px,pz,sc){
 const t={nodes:[],leaves:[],base:[px,0,pz]};
 const addN=(parent,at,restQ,L,r,depth)=>{const n={parent,at,restQ,L,r,depth,th:[0,0,0],om:[0,0,0],imp:[0,0,0],nLeaves:0};t.nodes.push(n);return n;};
 const t1=addN(null,0,Q.axis(1,0,0,(rng()-.5)*0.08),2.2*sc,0.18*sc,0), t2=addN(t1,1,Q.axis(0,0,1,(rng()-.5)*0.15),1.8*sc,0.13*sc,0);
 const grow=(p,d)=>{if(d>3)return;const k=d===1?4:3;for(let i=0;i<k;i++){const q=Q.mul(Q.axis(0,1,0,i/k*6.283+rng()*0.8),Q.axis(1,0,0,(d===1?0.75:0.6)+rng()*0.3));
  grow(addN(p,d===1?0.55+0.45*i/k:0.5+0.5*rng(),q,p.L*(0.62+rng()*0.15),p.r*0.55,d),d+1);}};
 grow(t2,1);
 for(const n of t.nodes)if(n.depth>=2){const c=n.depth===3?16:4;n.nLeaves=c;for(let i=0;i<c;i++)t.leaves.push({node:n,at:0.3+0.7*rng(),
  restQ:Q.mul(Q.axis(0,1,0,rng()*6.283),Q.axis(1,0,0,0.5+rng()*0.9)),size:0.22*(0.8+0.4*rng()),ph:[0,0],om:[0,0],seed:rng()*100,
  col:[0.18+rng()*0.1,0.38+rng()*0.15,0.1+rng()*0.06]});}
 transform(t,0);
 for(const n of t.nodes){n.mass=700*Math.PI*n.r*n.r*n.L+n.nLeaves*LEAF_MASS;n.area=2*n.r*n.L+n.nLeaves*LEAF_AREA*AREA_SCALE;n.c0=add(n.joint,scl(sub(n.tip,n.joint),0.5));n.prevTip=n.tip.slice();}
 for(const n of t.nodes){let I=n.mass*n.L*n.L/3;for(const m of t.nodes){if(m===n)continue;let p=m.parent;while(p&&p!==n)p=p.parent;if(p===n){const d=sub(m.c0,n.joint);I+=m.mass*dot(d,d);}}n.I=I;}
 let cc=[0,0,0];for(const l of t.leaves)cc=add(cc,leafPos(l));cc=scl(cc,1/t.leaves.length);let rr=0;for(const l of t.leaves)rr=Math.max(rr,Math.hypot(...sub(leafPos(l),cc)));
 t.crown=cc;t.crownR=rr*0.9;trees.push(t);
}
function transform(t,dt){for(const n of t.nodes){const p=n.parent;n.joint=p?add(p.joint,Q.rot(p.q,[0,p.L*n.at,0])):t.base;n.frame=p?Q.mul(p.q,n.restQ):n.restQ;n.q=Q.mul(n.frame,Q.vec(n.th));n.tip=add(n.joint,Q.rot(n.q,[0,n.L,0]));}}
const leafPos=l=>add(l.node.joint,Q.rot(l.node.q,[0,l.node.L*l.at,0]));
function stepTree(t,dt){
 transform(t,dt);
 for(const n of t.nodes){n.vel=scl(sub(n.tip,n.prevTip),1/dt);n.prevTip=n.tip;const pp=add(n.joint,scl(sub(n.tip,n.joint),0.6));
  n.w=wind(pp[0],pp[1],pp[2],true);const vr=sub(n.w,n.vel),s=Math.hypot(vr[0],vr[1],vr[2]);
  n.F=add(scl(vr,0.5*RHO*CD*n.area*s),scl(n.imp,1/dt));n.imp=[0,0,0];n.M=cross(pp,n.F);}
 for(let i=t.nodes.length-1;i>0;i--){const n=t.nodes[i],p=n.parent;p.F=add(p.F,n.F);p.M=add(p.M,n.M);} // subtree load reaches each joint
 for(const n of t.nodes){const tl=Q.rot(Q.conj(n.frame),sub(n.M,cross(n.joint,n.F)));
  const k=3*W.E*(Math.PI*n.r**4/4)/n.L, c=2*0.08*Math.sqrt(k*n.I);
  for(const a of[0,2]){n.om[a]+=dt*(tl[a]-k*n.th[a]-c*n.om[a])/n.I;n.th[a]+=dt*n.om[a];}}
 // Leaves: pitch from pressure on the blade, twist from vortex shedding at the Strouhal frequency (f = 0.2 v / chord)
 const w0=2*Math.PI*4,w2=w0*w0,z=2*0.15*w0;
 for(const l of t.leaves){const n=l.node,q=Q.mul(Q.mul(n.q,l.restQ),Q.vec([l.ph[0],l.ph[1],0])),nr=Q.rot(q,[0,0,1]);
  const vr=sub(n.w,n.vel),s=Math.hypot(vr[0],vr[1],vr[2]),pr=dot(nr,vr)*s;
  const shed=0.3*s*s*Math.sin(2*Math.PI*(0.2*s/0.12)*T+l.seed);
  l.om[0]+=dt*(3.8*pr-w2*l.ph[0]-z*l.om[0]);l.om[1]+=dt*(shed-w2*l.ph[1]-z*l.om[1]);
  for(const a of[0,1]){l.ph[a]=clamp(l.ph[a]+dt*l.om[a],-1.3,1.3);}}
}
for(const[x,z,s]of[[-6,-4,1.1],[9,-8,1],[-9,7,0.9],[13,5,1.15],[-2,-11,0.95]])buildTree(x,z,s);

// ---------- grass: one damped bend per cell, blades are drawn as constant-length arcs ----------
const G=48, GAREA=48, gb=new Float32Array(G*G*2), gv=new Float32Array(G*G*2), gtex=new Float32Array(G*G*4);
function stepGrass(dt){const wg=2*Math.PI*1.5,w2=wg*wg,z=2*0.2*wg;
 for(let j=0;j<G;j++)for(let i=0;i<G;i++){const k=(j*G+i)*2,x=(i+0.5)/G*GAREA-GAREA/2,zz=(j+0.5)/G*GAREA-GAREA/2,w=wind(x,0.3,zz,true),s=Math.hypot(w[0],w[2]);
  for(const a of[0,1]){gv[k+a]+=dt*(0.3*s*(a?w[2]:w[0])-w2*gb[k+a]-z*gv[k+a]);gb[k+a]+=dt*gv[k+a];}
  gtex[k*2]=gb[k];gtex[k*2+1]=gb[k+1];}}
const gCell=(x,z)=>{const i=Math.floor((x/GAREA+0.5)*G),j=Math.floor((z/GAREA+0.5)*G);return i<0||j<0||i>=G||j>=G?-1:(j*G+i)*2;};

// ---------- rain: Marshall-Palmer sizes, Atlas terminal speed, drag relaxation toward the wind ----------
const MAXD=14000, dp=new Float32Array(MAXD*3), dv=new Float32Array(MAXD*3), dd=new Float32Array(MAXD); let nDrops=0;
const MAXS=8000, sp=new Float32Array(MAXS*3), sv=new Float32Array(MAXS*3), sk=new Uint8Array(MAXS); let nSpl=0;
const ripples=new Float32Array(64*4); let ripI=0; for(let i=0;i<64;i++)ripples[i*4+2]=-99;
const vTerm=D=>Math.max(0.5,9.65-10.3*Math.exp(-0.6*D)); // D in mm
const stats={splashes:0,leafHits:0,ripples:0};
let camT=[0,1.5,0];
function spawnDrop(i,top){const R=Math.max(0.5,60*W.rain**1.5),lam=4.1*R**-0.21,D=clamp(-Math.log(1-rng())/lam,0.3,5.5),vt=vTerm(D);
 const y=top?16+rng()*4:rng()*20,w=wind(camT[0],y,camT[2],false),ft=y/vt;
 dp[i*3]=camT[0]+(rng()-.5)*34-w[0]*ft;dp[i*3+1]=y;dp[i*3+2]=camT[2]+(rng()-.5)*34-w[2]*ft; // upwind by the drift, so it lands round the camera
 dv[i*3]=w[0];dv[i*3+1]=-vt;dv[i*3+2]=w[2];dd[i]=D;}
function spray(x,y,z,vx,vy,vz,kind){if(nSpl>=MAXS)return;const i=nSpl++;sp[i*3]=x;sp[i*3+1]=y;sp[i*3+2]=z;sv[i*3]=vx;sv[i*3+1]=vy;sv[i*3+2]=vz;sk[i]=kind;}
function ripple(x,z,amp){ripples.set([x,z,T,amp],ripI*4);ripI=(ripI+1)%64;stats.ripples++;}
// Splash on impact: Mundo's K = We^0.5 Re^0.25 decides deposit (K < 57.7) or splash; the crown's droplets scale with how far K is past it.
function impact(x,y,z,D,v,surf){
 const Dm=D*1e-3,We=1000*v*v*Dm/0.072,Re=1000*v*Dm/1e-3,K=Math.sqrt(We)*Re**0.25;
 if(surf==='water'){ripple(x,z,clamp(D/3,0.2,1.5));if(D>2.2&&rng()<0.5)spray(x,y+0.01,z,0,0.35*v*(0.6+0.4*rng()),0,0);} // Worthington jet
 if(K<57.7)return; const f={stone:1,water:0.6,grass:0.2,leaf:0.3}[surf], n=Math.round(Math.min(10,1.2*(K/57.7-1))*f*(0.5+rng()));
 stats.splashes++;
 for(let k=0;k<n;k++){const a=rng()*6.283,sp_=v*(0.15+0.3*rng()),el=0.35+rng()*0.6;spray(x,y+0.01,z,Math.cos(a)*sp_*Math.cos(el),sp_*Math.sin(el),Math.sin(a)*sp_*Math.cos(el),0);}
}
function stepRain(dt){
 const target=Math.round(W.rain*MAXD);while(nDrops<target)spawnDrop(nDrops++,true); if(nDrops>target)nDrops=Math.max(target,nDrops-Math.ceil(dt*3000));
 for(let i=0;i<nDrops;i++){const o=i*3,D=dd[i],vt=vTerm(D),tau=vt/9.81,w=wind(dp[o],dp[o+1],dp[o+2],false),a=Math.min(1,dt/tau);
  dv[o]+=(w[0]-dv[o])*a;dv[o+1]+=(-vt-dv[o+1])*a;dv[o+2]+=(w[2]-dv[o+2])*a;
  const x=dp[o]+=dv[o]*dt,y=dp[o+1]+=dv[o+1]*dt,z=dp[o+2]+=dv[o+2]*dt,v=Math.hypot(dv[o],dv[o+1],dv[o+2]);
  let hit=false;
  for(const t of trees){const d=sub([x,y,z],t.crown);if(dot(d,d)<t.crownR*t.crownR&&rng()<1-Math.exp(-1.6*v*dt)){ // optical depth of the crown
   const l=t.leaves[(rng()*t.leaves.length)|0],m=1000*Math.PI*(D*1e-3)**3/6,p=m*v;
   l.om[0]+=p*0.1/(LEAF_MASS*l.size*l.size/3)*(rng()<0.5?1:-1);l.node.imp=add(l.node.imp,scl([dv[o],dv[o+1],dv[o+2]],m));stats.leafHits++;
   const lp=leafPos(l);if(rng()<0.35)spray(lp[0],lp[1],lp[2],0,0,0,1);impact(lp[0],lp[1],lp[2],D,v,'leaf');hit=true;break;}}
  if(!hit){const s=stoneAt(x,z),h=s?s.h:0;if(y<=h){hit=true;const surf=s?'stone':inPond(x,z)?'water':'grass';impact(x,h,z,D,v,surf);
   if(surf==='grass'){const c=gCell(x,z);if(c>=0){gv[c]+=(rng()-.5)*0.4;gv[c+1]+=(rng()-.5)*0.4;}}}}
  if(hit||Math.abs(x-camT[0])>120||Math.abs(z-camT[2])>120)spawnDrop(i,true);}
 for(let i=0;i<nSpl;i++){const o=i*3;sv[o+1]-=9.81*dt;const dr=Math.exp(-dt*(sk[i]?0.2:1.5));sv[o]*=dr;sv[o+2]*=dr;
  const x=sp[o]+=sv[o]*dt,y=sp[o+1]+=sv[o+1]*dt,z=sp[o+2]+=sv[o+2]*dt,s=stoneAt(x,z),h=s?s.h:0;
  if(y<=h){if(sk[i]===1)impact(x,h,z,4,Math.hypot(sv[o],sv[o+1],sv[o+2]),s?'stone':inPond(x,z)?'water':'grass');
   const j=--nSpl;sp.copyWithin(o,j*3,j*3+3);sv.copyWithin(o,j*3,j*3+3);sk[i]=sk[j];i--;}}
}

// ---------- GL ----------
const CLOUD=`uniform float uTime,uCover;uniform vec2 uCloudOff;uniform vec3 uSun;
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+1.),f.x),f.y);}
